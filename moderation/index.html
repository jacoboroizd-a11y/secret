<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Moderación — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="page"><section class="hero"><span class="eyebrow">MODERACIÓN</span><h1>Una comunidad útil necesita mantenimiento.</h1><p>Esta consola demo muestra reportes y sugerencias guardados localmente.</p></section><div class="section-head"><div><span class="eyebrow">REPORTES</span><h2>Cola de revisión</h2></div></div><div id="reports"></div><div class="section-head"><div><span class="eyebrow">LUGARES</span><h2>Sugerencias pendientes</h2></div></div><div id="suggestions"></div></main>
<script>
document.addEventListener("DOMContentLoaded",()=>{const reports=getJSON("reports",[]),s=getJSON("placeSuggestions",[]);document.getElementById("reports").innerHTML=reports.length?`<table class="report-table"><thead><tr><th>Tipo</th><th>Motivo</th><th>Estado</th></tr></thead><tbody>${reports.map(r=>`<tr><td>${r.type} · ${r.itemId}</td><td>${escapeHtml(r.reason)}</td><td><span class="badge">${r.status}</span></td></tr>`).join("")}</tbody></table>`:'<div class="empty">No hay reportes locales.</div>';document.getElementById("suggestions").innerHTML=s.length?`<table class="report-table"><thead><tr><th>Lugar</th><th>Zona</th><th>Estado</th></tr></thead><tbody>${s.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.area)}</td><td><span class="badge">${x.status}</span></td></tr>`).join("")}</tbody></table>`:'<div class="empty">No hay sugerencias locales.</div>'})
</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('');</script></body></html>
