<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Guía — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="detail"><a class="back" href="index.html">← Todas las guías</a><section id="guide-head" class="detail-head"></section><article id="guide-body" class="detail-body"></article></main>
<script>document.addEventListener("DOMContentLoaded",()=>{const g=guide(qs("id"))||D.guides[0];document.title=g.title+" — Managua de Noche";document.getElementById("guide-head").innerHTML=`<span class="eyebrow">${g.category} · ${g.read} MIN</span><h1>${g.title}</h1><p class="lead">${g.deck}</p><div class="detail-actions"><button class="primary" onclick="if(requireUser(location.href)){toast('Guía guardada')}">Guardar guía</button><button class="secondary" onclick="shareItem(location.href)">Compartir</button></div>`;document.getElementById("guide-body").innerHTML=g.sections.map(([h,p])=>`<h2>${h}</h2><p>${p}</p>`).join("")+`<div class="source-box"><b>Fuentes consultadas</b><ul>${g.sources.map(([n,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${n}</a></li>`).join("")}</ul></div>`})</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('guides');</script></body></html>
