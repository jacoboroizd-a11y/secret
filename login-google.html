<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in with Google — Simulación</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-card">
    <div class="provider-logo" aria-hidden="true">G</div>
    <h1>Sign in with Google</h1>
    <p>Continúa para ver los resultados de la encuesta.</p>

    <button id="googleBtn" class="provider-button">Continue with Google</button>
  </main>

  <script src="script.js"></script>
  <script>
    track("login_google_view");

    document.getElementById("googleBtn").addEventListener("click", function () {
      track("google_button_clicked");
      location.href = "failed.html?scenario=google";
    });
  </script>
</body>
</html>
