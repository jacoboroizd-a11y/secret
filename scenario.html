<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Managua Eats — Ver resultados</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <div class="app-logo">M</div>
      <div>
        <strong>Managua Eats</strong>
        <span>Resultados de la encuesta</span>
      </div>
    </div>

    <h1>Consulta los resultados</h1>
    <p class="subtle">Elige cómo quieres continuar.</p>

    <div class="auth-actions">
      <a class="provider-btn" href="login-google.html" onclick="track('scenario_google')">
        <span class="provider-icon provider-g">G</span>
        <span>Continuar con Google</span>
      </a>

      <a class="provider-btn" href="login-microsoft.html" onclick="track('scenario_microsoft')">
        <span class="provider-icon provider-ms">▦</span>
        <span>Continuar con Microsoft</span>
      </a>

      <div class="divider"><span>o</span></div>

      <a class="primary link-btn" href="login-manual.html" onclick="track('scenario_manual')">
        Continuar con correo
      </a>
    </div>

    <p class="legal-copy">Al continuar, aceptas los términos de uso de la plataforma.</p>
  </main>
  <script src="script.js"></script>
  <script>track("scenario_view");</script>
</body>
</html>
