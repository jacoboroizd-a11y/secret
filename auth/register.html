<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Crear cuenta — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="page"><section class="form-card"><span class="eyebrow">CREAR CUENTA</span><h1>Sumate a Managua.</h1><p>Community Alpha: por ahora esta cuenta vive únicamente en tu navegador.</p><form onsubmit="registerUser(event)"><div class="form-row"><div><label>Usuario</label><input id="reg-user" minlength="3" maxlength="20" required placeholder="ej. jacobo_mga"></div><div><label>Nombre visible</label><input id="reg-name" placeholder="Jacobo"></div></div><label>Correo</label><input id="reg-email" type="email" required><label>Bio opcional</label><textarea id="reg-bio" placeholder="Qué te gusta hacer en Managua..."></textarea><button class="primary">Crear cuenta demo</button></form><p class="helper">No se solicita contraseña porque esta versión no tiene backend ni autenticación real.</p></section></main>
<script>function registerUser(e){e.preventDefault();const u={username:document.getElementById("reg-user").value.trim(),name:document.getElementById("reg-name").value.trim(),email:document.getElementById("reg-email").value.trim(),bio:document.getElementById("reg-bio").value.trim()};setJSON("user",u);toast("Cuenta local creada");const r=qs("return");setTimeout(()=>location.href=r||"../index.html",600)}</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('');</script></body></html>
