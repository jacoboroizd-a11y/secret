<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceder — Managua Eats</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-card compact">
    <div class="auth-brand center">
      <div class="app-logo">M</div>
    </div>

    <h1>Accede para continuar</h1>
    <p class="subtle">Usa tu correo para ver los resultados de la encuesta.</p>

    <form id="emailForm" class="auth-form">
      <div class="field floating">
        <input id="email" type="email" autocomplete="off" placeholder=" " required>
        <label for="email">Correo electrónico</label>
      </div>

      <button id="emailNext" class="primary wide" type="submit">
        <span class="btn-label">Siguiente</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <a class="text-link" href="scenario.html">Usar otro método</a>
  </main>

  <script src="script.js"></script>
  <script>
    track("login_manual_view");
    document.getElementById("emailForm").addEventListener("submit", function(e){
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const btn = document.getElementById("emailNext");
      setLoading(btn, true);
      track("manual_email_submitted", { email });
      setTimeout(() => location.href = "failed.html?scenario=manual", 500);
    });
  </script>
</body>
</html>
