<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Encuesta de restaurantes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <div class="brand">Managua Food Guide</div>
    <h1>¿Cuáles son tus restaurantes favoritos de Managua?</h1>
    <p>Ayúdanos a mejorar nuestra guía local. La encuesta toma menos de un minuto.</p>

    <form id="surveyForm">
      <label for="food">¿Qué tipo de comida prefieres?</label>
      <select id="food" required>
        <option value="">Selecciona una opción</option>
        <option>Nicaragüense</option>
        <option>Italiana</option>
        <option>Asiática</option>
        <option>Hamburguesas</option>
      </select>

      <label for="frequency">¿Con qué frecuencia comes fuera?</label>
      <select id="frequency" required>
        <option value="">Selecciona una opción</option>
        <option>Varias veces por semana</option>
        <option>Una vez por semana</option>
        <option>Algunas veces al mes</option>
        <option>Raramente</option>
      </select>

      <button type="submit">Submit</button>
    </form>
  </main>

  <script src="script.js"></script>
  <script>
    track("survey_view");

    document.getElementById("surveyForm").addEventListener("submit", function (e) {
      e.preventDefault();
      track("survey_submit");
      location.href = "scenario.html";
    });
  </script>
</body>
</html>
