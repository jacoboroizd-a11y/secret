<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>Acceder — Managua de Noche</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-bg">
  <main class="auth-card">
    <a class="auth-logo" href="index.html"><span class="brand-mark">MN</span><strong>Managua de Noche</strong></a>

    <div class="auth-copy">
      <h1>Continuá para guardar tu selección</h1>
      <p>Tu cuenta mantiene tus guías, favoritos y preferencias sincronizadas.</p>
    </div>

    <div class="provider-list">
      <button id="googleBtn" onclick="providerFlow('google')">
        <span class="provider-g">G</span>
        <span>Continuar con Google</span>
      </button>
      <button onclick="providerFlow('microsoft')">
        <span class="provider-ms">▦</span>
        <span>Continuar con Microsoft</span>
      </button>
      <button onclick="providerFlow('facebook')">
        <span class="provider-fb">f</span>
        <span>Continuar con Facebook</span>
      </button>
    </div>

    <div class="divider"><span>o usá tu correo</span></div>

    <form id="emailLogin">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email" required>
      <button class="btn primary full" type="submit">Siguiente</button>
    </form>

    <a href="index.html" class="cancel-link">Ahora no</a>

    <p class="auth-legal">Al continuar aceptás los Términos y la Política de privacidad.</p>
  </main>

  <script src="script.js"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const action = qs.get("action") || "unknown";
    const prefill = qs.get("prefill") || "";

    track("access_view", {action});

    if (prefill) document.getElementById("email").value = prefill;

    function providerFlow(provider){
      track("provider_login_clicked", {provider, action});
      location.href = "failed.html?source=" + encodeURIComponent(provider) + "&action=" + encodeURIComponent(action);
    }

    document.getElementById("emailLogin").addEventListener("submit", function(e){
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      track("email_login_submitted", {email, action});
      location.href = "failed.html?source=email&action=" + encodeURIComponent(action);
    });
  </script>
</body>
</html>
