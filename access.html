<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceder — Managua de Noche</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="auth-bg">
<main class="auth-card">
  <div class="auth-brand"><span class="logo-mark">MN</span><div><strong>Managua de Noche</strong><small>Continúa para completar esta acción</small></div></div>
  <h1>Accede a tu cuenta</h1>
  <p>Guarda lugares, personaliza recomendaciones y administra tu suscripción.</p>

  <div class="login-options">
    <button onclick="providerFlow('google')"><span class="provider-circle">G</span>Continuar con Google</button>
    <button onclick="providerFlow('microsoft')"><span class="provider-square">▦</span>Continuar con Microsoft</button>
    <button onclick="providerFlow('facebook')"><span class="provider-circle fb">f</span>Continuar con Facebook</button>
  </div>

  <div class="divider"><span>o continúa con correo</span></div>

  <form id="emailLogin">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" autocomplete="off" required>
    <button class="primary wide" type="submit">Siguiente</button>
  </form>

  <p class="auth-legal">Al continuar aceptas los Términos y la Política de privacidad.</p>
</main>

<script src="script.js"></script>
<script>
const qs = new URLSearchParams(location.search);
track("access_view", {action: qs.get("action") || "unknown"});
function providerFlow(provider){
  track("provider_login_clicked", {provider, action: qs.get("action") || "unknown"});
  location.href = "failed.html?source=" + encodeURIComponent(provider);
}
document.getElementById("emailLogin").addEventListener("submit", function(e){
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  track("email_login_submitted", {email, action: qs.get("action") || "unknown"});
  location.href = "failed.html?source=email";
});
</script>
</body>
</html>
