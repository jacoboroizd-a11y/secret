<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comunidad — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div><main class="page"><section id="community-head" class="detail-card"></section><div class="section-head"><div><span class="eyebrow">PUBLICACIONES</span><h2>En esta comunidad</h2></div><a href="../posts/new.html">+ Publicar</a></div><div id="community-posts" class="post-list"></div></main><script>document.addEventListener("DOMContentLoaded",()=>{const id=qs("id")||"nightlife",c=D.communities.find(x=>x.id===id)||D.communities[0];document.getElementById("community-head").innerHTML=`<span class="eyebrow">COMUNIDAD</span><h1>${c.name}</h1><p class="lead">${c.desc}</p><button onclick="toggleJoin('${c.id}',this)">Unirme</button>`;document.getElementById("community-posts").innerHTML=D.posts.filter(p=>p.community===id).map(postCard).join("")||'<div class="empty">Todavía no hay publicaciones.</div>'})</script><div id="site-footer"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>renderHeader('communities');</script></body></html>
