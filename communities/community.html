<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Comunidad — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="page"><section id="comm-head" class="detail-head"></section><div class="layout"><div><div class="section-head"><div><span class="eyebrow">CONVERSACIONES</span><h2>Lo último</h2></div><a href="../posts/new.html">+ Publicar</a></div><div id="comm-posts" class="post-list"></div></div><aside><section class="side-card"><span class="eyebrow">ACERCA</span><h3>Cómo funciona</h3><p>Unite para seguir la comunidad. Las publicaciones pueden votarse, guardarse y reportarse.</p></section></aside></div></main>
<script>document.addEventListener("DOMContentLoaded",()=>{const id=qs("id")||"nightlife",c=community(id)||D.communities[0],joined=getJoined();document.getElementById("comm-head").innerHTML=`<div class="community-icon ${c.color}" style="margin-bottom:12px">${c.icon}</div><span class="eyebrow">COMUNIDAD</span><h1>${c.name}</h1><p class="lead">${c.desc}</p><div class="detail-actions"><button class="${joined.has(c.id)?"secondary":"primary"}" onclick="toggleJoin('${c.id}',this)">${joined.has(c.id)?"Unido":"Unirme"}</button><span class="secondary">${formatNumber(c.members)} miembros</span></div>`;document.getElementById("comm-posts").innerHTML=allPosts().filter(p=>p.community===c.id).map(postCard).join("")||'<div class="empty">Todavía no hay publicaciones.</div>'})</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('communities');</script></body></html>
