<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Configuración — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="page"><section class="form-card"><span class="eyebrow">CONFIGURACIÓN</span><h1>Tu cuenta</h1><div id="settings-user"></div><div class="setting-row"><div><b>Apariencia</b><small>Cambiar entre modo claro y oscuro.</small></div><button onclick="toggleTheme()">Cambiar tema</button></div><div class="setting-row"><div><b>Datos locales</b><small>Esta demo guarda estado en localStorage.</small></div><button onclick="exportLocalData()">Exportar</button></div><div class="setting-row"><div><b>Restablecer demo</b><small>Borra posts, votos, comentarios y preferencias locales.</small></div><button onclick="resetDemo()">Restablecer</button></div></section></main>
<script>document.addEventListener("DOMContentLoaded",()=>{const u=getUser();if(!u){location.href="../auth/register.html";return}document.getElementById("settings-user").innerHTML=`<div class="setting-row"><div><b>u/${escapeHtml(u.username)}</b><small>${escapeHtml(u.email)}</small></div><a class="secondary" href="../profile/index.html">Ver perfil</a></div>`});function exportLocalData(){const obj={user:getUser(),saved:[...getSaved()],joined:[...getJoined()],following:[...getFollowing()],posts:getUserPosts(),comments:getUserComments(),reports:getJSON("reports",[])};const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="managua-de-noche-demo.json";a.click();toast("Exportado")}function resetDemo(){if(confirm("¿Borrar todos los datos locales de esta demo?")){Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>localStorage.removeItem(k));location.href="../index.html"}}</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('');</script></body></html>
