<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Lugar — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="detail"><a class="back" href="index.html">← Volver al directorio</a><section id="place-head" class="detail-head"></section><div class="detail-body"><div id="signals"></div><h2>Conversación comunitaria</h2><p>Acá las opiniones no alteran los datos públicos del lugar: viven como experiencias, comentarios y posts separados.</p><div id="place-posts" class="post-list"></div><div class="source-box" id="place-source"></div></div></main>
<script>document.addEventListener("DOMContentLoaded",()=>{const id=qs("id")||D.places[0].id,p=place(id)||D.places[0],f=getFollowing();document.title=p.name+" — Managua de Noche";document.getElementById("place-head").innerHTML=`<span class="eyebrow">${p.type} · ${p.area}</span><h1>${p.name}</h1><p class="lead">${p.summary}</p><div class="chips">${p.tags.map(t=>`<span>${t}</span>`).join("")}</div><div class="stat-grid">${p.rating?`<div class="stat"><b>${p.rating}</b><span>rating público</span></div><div class="stat"><b>${formatNumber(p.reviews)}</b><span>reseñas</span></div>`:""}${p.price?`<div class="stat"><b>${p.price}</b><span>rango reportado</span></div>`:""}<div class="stat"><b>${p.area}</b><span>zona</span></div></div><div class="detail-actions"><button class="${f.has(p.id)?"secondary":"primary"}" onclick="toggleFollowPlace('${p.id}',this)">${f.has(p.id)?"Siguiendo":"+ Seguir lugar"}</button><button class="secondary" onclick="shareItem(location.href)">Compartir</button><button class="secondary" onclick="openReport('place','${p.id}')">Reportar dato</button></div>`;document.getElementById("signals").innerHTML=`<div class="signal-box"><b>Señales públicas</b><ul>${p.signals.map(s=>`<li>${s}</li>`).join("")}</ul></div><h2>Datos útiles</h2><p><b>Dirección:</b> ${p.address||"No disponible"}<br><b>Horario:</b> ${p.hours||"Consultar"}<br>${p.phone?`<b>Teléfono:</b> ${p.phone}`:""}</p>`;const mentions=allPosts().filter(x=>(x.title+" "+x.body).toLowerCase().includes(p.name.toLowerCase().split(" ")[0]));document.getElementById("place-posts").innerHTML=mentions.map(postCard).join("")||'<div class="empty">Todavía no hay una conversación específica sobre este lugar.</div>';document.getElementById("place-source").innerHTML=`Datos editoriales: ${p.sourceType}.${p.sourceUrl?` <a href="${p.sourceUrl}" target="_blank" rel="noopener">Ver fuente pública</a>`:""}`})</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('places');</script></body></html>
