<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lugar — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div><main class="page"><section id="place-detail" class="detail-card"></section><div class="section-head"><div><span class="eyebrow">COMUNIDAD</span><h2>Qué dice la gente</h2></div></div><div class="comment"><b>u/managualocal</b><p>Este es un ejemplo de cómo se verían comentarios y experiencias asociadas al lugar.</p></div><div class="comment"><b>u/vale22</b><p>Podríamos permitir fotos, precios reportados y recomendaciones específicas.</p></div></main><script>document.addEventListener("DOMContentLoaded",()=>{const id=qs("id")||"zona-hippos",p=D.places.find(x=>x.id===id)||D.places[0];document.getElementById("place-detail").innerHTML=`<span class="eyebrow">${p.type} · ${p.area}</span><h1>${p.name}</h1><p class="lead">${p.summary}</p><div class="chips">${p.tags.map(t=>`<span>${t}</span>`).join("")}</div><p>★ ${p.rating} · ${p.reviews} reseñas</p>`})</script><div id="site-footer"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>renderHeader('places');</script></body></html>
