<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Sugerir lugar — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="page"><section class="form-card"><span class="eyebrow">COLABORAR</span><h1>Sugerir un lugar</h1><p>Las sugerencias quedan en una cola local de moderación en esta demo.</p><form onsubmit="submitPlaceSuggestion(event)"><div class="form-row"><div><label>Nombre</label><input id="s-name" required></div><div><label>Zona</label><input id="s-area" required></div></div><label>Tipo</label><select id="s-type"><option>Bar</option><option>Restaurante</option><option>Café</option><option>Evento / espacio</option><option>Otro</option></select><label>Link público (Maps, Instagram, sitio)</label><input id="s-link" type="url"><label>Por qué debería agregarse</label><textarea id="s-note" required></textarea><button class="primary">Enviar a moderación</button></form></section></main>
<script>function submitPlaceSuggestion(e){e.preventDefault();if(!requireUser(location.href))return;const arr=getJSON("placeSuggestions",[]);arr.unshift({id:"s"+Date.now(),name:document.getElementById("s-name").value,area:document.getElementById("s-area").value,type:document.getElementById("s-type").value,link:document.getElementById("s-link").value,note:document.getElementById("s-note").value,status:"Pendiente"});setJSON("placeSuggestions",arr);toast("Sugerencia enviada");setTimeout(()=>location.href="index.html",700)}</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('places');</script></body></html>
