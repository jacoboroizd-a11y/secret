<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Lugares — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="page"><section class="hero"><span class="eyebrow">DIRECTORIO</span><h1>Lugares con contexto, no solamente estrellas.</h1><p>Datos públicos para orientarte y conversación comunitaria para entender cómo se siente realmente cada lugar.</p></section>
<div class="control-row"><input id="place-q" placeholder="Buscar bar, café, lounge..."><select id="place-area"><option value="">Todas las zonas</option><option>Los Robles</option><option>Sur de Managua</option><option>Club Terraza</option><option>Galerías / Santo Domingo</option><option>Camino de Oriente</option><option>Centro histórico</option><option>Carretera a Masaya</option></select><select id="place-type"><option value="">Todo tipo</option><option>Bar</option><option>Restaurante</option><option>Beer garden</option></select></div>
<div class="section-head"><div><span class="eyebrow">MANAGUA</span><h2 id="place-count"></h2></div><a href="suggest.html">+ Sugerir lugar</a></div><div id="places-grid" class="place-grid"></div></main>
<script>
function renderPlaces(){const q=document.getElementById("place-q").value.toLowerCase(),a=document.getElementById("place-area").value,t=document.getElementById("place-type").value;const items=D.places.filter(p=>(!q||(p.name+" "+p.summary+" "+p.tags.join(" ")).toLowerCase().includes(q))&&(!a||p.area===a)&&(!t||p.type.includes(t)));document.getElementById("place-count").textContent=items.length+" lugares";document.getElementById("places-grid").innerHTML=items.map(placeCard).join("")||'<div class="empty">No encontramos nada con esos filtros.</div>'}
document.addEventListener("DOMContentLoaded",()=>{["place-q","place-area","place-type"].forEach(id=>document.getElementById(id).addEventListener("input",renderPlaces));renderPlaces()});
</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('places');</script></body></html>
