<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Guardados — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="page"><section class="hero"><span class="eyebrow">GUARDADOS</span><h1>Tu pequeño archivo de Managua.</h1><p>Posts y eventos que querés volver a encontrar.</p></section><div class="section-head"><div><span class="eyebrow">POSTS</span><h2>Para leer después</h2></div></div><div id="saved-posts" class="post-list"></div><div class="section-head"><div><span class="eyebrow">EVENTOS</span><h2>Planes guardados</h2></div></div><div id="saved-events" class="event-list"></div></main>
<script>document.addEventListener("DOMContentLoaded",()=>{const sp=allPosts().filter(p=>getSaved().has(p.id)),se=D.events.filter(e=>new Set(getJSON("savedEvents",[])).has(e.id));document.getElementById("saved-posts").innerHTML=sp.map(postCard).join("")||'<div class="empty">Todavía no guardaste posts.</div>';document.getElementById("saved-events").innerHTML=se.map(eventCard).join("")||'<div class="empty">Todavía no guardaste eventos.</div>'})</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('');</script></body></html>
