<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Nueva publicación — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="page"><section class="form-card"><span class="eyebrow">NUEVA PUBLICACIÓN</span><h1>Contá, preguntá o recomendá.</h1><p>Elegí una comunidad y agregá suficiente contexto para que las respuestas sirvan.</p><form onsubmit="createPost(event)"><label>Comunidad</label><select id="p-community"></select><label>Título</label><input id="p-title" maxlength="140" required placeholder="¿Qué querés saber o compartir?"><label>Contenido</label><textarea id="p-body" required placeholder="Agregá contexto, presupuesto, zona, fecha o detalles útiles..."></textarea><button class="primary">Publicar</button></form></section></main>
<script>document.addEventListener("DOMContentLoaded",()=>{if(!requireUser(location.href))return;document.getElementById("p-community").innerHTML=D.communities.map(c=>`<option value="${c.id}">${c.name}</option>`).join("")});function createPost(e){e.preventDefault();const arr=getUserPosts();const p={id:"up"+Date.now(),community:document.getElementById("p-community").value,author:getUser().username,title:document.getElementById("p-title").value.trim(),body:document.getElementById("p-body").value.trim(),score:1,time:"ahora",comments:[]};arr.unshift(p);setJSON("userPosts",arr);toast("Publicado");setTimeout(()=>location.href="post.html?id="+p.id,600)}</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('');</script></body></html>
