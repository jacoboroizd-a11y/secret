<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva publicación — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div><main class="page"><section class="form-card"><span class="eyebrow">NUEVA PUBLICACIÓN</span><h1>Compartí algo con la comunidad</h1><form onsubmit="event.preventDefault();toast('Publicado en demo local');setTimeout(()=>location.href='../index.html',700)"><label>Comunidad</label><select id="communitySelect"></select><label>Título</label><input required maxlength="120"><label>Contenido</label><textarea required></textarea><button class="primary">Publicar</button></form></section></main><script>document.addEventListener("DOMContentLoaded",()=>{if(!getUser()){location.href='../auth/register.html';return}document.getElementById('communitySelect').innerHTML=D.communities.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')})</script><div id="site-footer"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>renderHeader('');</script></body></html>
