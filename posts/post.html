<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Publicación — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="detail"><a class="back" href="../index.html">← Inicio</a><section id="post-head" class="detail-head"></section><div class="detail-body"><section class="comment-form" id="comment-form"></section><section class="comments"><h2 id="comment-title">Comentarios</h2><div id="comment-list"></div></section></div></main>
<script>
document.addEventListener("DOMContentLoaded",()=>{const id=qs("id")||allPosts()[0].id,p=findPost(id)||allPosts()[0],c=community(p.community),saved=getSaved();document.title=p.title+" — Managua de Noche";document.getElementById("post-head").innerHTML=`<span class="eyebrow">${c?.name||p.community} · u/${escapeHtml(p.author)} · ${p.time||"ahora"}</span><h1>${escapeHtml(p.title)}</h1><p class="lead">${escapeHtml(p.body)}</p><div class="detail-actions"><button class="secondary" onclick="votePost('${p.id}',1)">▲ ${score(p)}</button><button class="secondary" onclick="toggleSave('${p.id}',this)">${saved.has(p.id)?"♥ Guardado":"♡ Guardar"}</button><button class="secondary" onclick="shareItem(location.href)">Compartir</button><button class="secondary" onclick="openReport('post','${p.id}')">Reportar</button></div>`;const u=getUser();document.getElementById("comment-form").innerHTML=u?`<textarea id="new-comment" placeholder="Sumate a la conversación..."></textarea><button class="primary" onclick="addComment('${p.id}')">Comentar</button>`:`<a class="secondary" href="../auth/register.html">Crear cuenta para comentar</a>`;renderComments(p)});
function renderComments(p){const extra=getUserComments()[p.id]||[],items=[...(p.comments||[]),...extra];document.getElementById("comment-title").textContent=items.length+" comentarios";document.getElementById("comment-list").innerHTML=items.map(c=>`<article class="comment"><div class="comment-avatar">${initials(c.author)}</div><div><div class="comment-meta">u/${escapeHtml(c.author)}</div><p>${escapeHtml(c.body)}</p><div class="comment-actions"><button>▲ ${c.score||1}</button><button>Responder</button><button onclick="openReport('comment','${c.id}')">Reportar</button></div></div></article>`).join("")||'<div class="empty">Todavía nadie comentó.</div>'}
function addComment(id){if(!requireUser(location.href))return;const el=document.getElementById("new-comment"),body=el.value.trim();if(!body)return;const map=getUserComments();map[id]=map[id]||[];map[id].push({id:"uc"+Date.now(),author:getUser().username,body,score:1});setJSON("userComments",map);el.value="";toast("Comentario publicado");renderComments(findPost(id))}
</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('');</script></body></html>
