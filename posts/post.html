<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicación — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div><main class="page"><section id="post-detail" class="detail-card"></section><div class="section-head"><div><span class="eyebrow">COMENTARIOS</span><h2>Conversación</h2></div></div><div id="comments"></div><section class="form-card" style="margin-top:16px"><form onsubmit="event.preventDefault();toast('Comentario publicado')"><textarea placeholder="Escribí un comentario..." required></textarea><button class="primary">Comentar</button></form></section></main><script>document.addEventListener("DOMContentLoaded",()=>{const id=qs("id")||"p1",p=D.posts.find(x=>x.id===id)||D.posts[0];document.getElementById("post-detail").innerHTML=`<span class="eyebrow">${communityName(p.community)} · u/${p.author}</span><h1>${p.title}</h1><p class="lead">${p.body}</p><p>▲ ${p.score} · ${p.comments} comentarios</p>`;document.getElementById("comments").innerHTML='<div class="comment"><b>u/roberto_mga</b><p>Ejemplo de comentario persistente en una versión con backend.</p></div><div class="comment"><b>u/vale22</b><p>La idea sería poder responder, votar y ordenar por relevancia.</p></div>'})</script><div id="site-footer"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>renderHeader('');</script></body></html>
