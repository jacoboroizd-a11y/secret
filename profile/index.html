<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Perfil — Managua de Noche</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml"></head><body><div id="site-header"></div>
<main class="page"><section id="profile-head" class="profile-head"></section><div class="profile-tabs"><button class="active" onclick="showProfileTab('posts',this)">Publicaciones</button><button onclick="showProfileTab('communities',this)">Comunidades</button><button onclick="showProfileTab('places',this)">Lugares seguidos</button></div><div id="profile-content"></div></main>
<script>
function showProfileTab(tab,btn){document.querySelectorAll(".profile-tabs button").forEach(b=>b.classList.toggle("active",b===btn));const root=document.getElementById("profile-content");if(tab==="posts")root.innerHTML=`<div class="post-list">${getUserPosts().map(postCard).join("")||'<div class="empty">Todavía no publicaste.</div>'}</div>`;if(tab==="communities")root.innerHTML=`<div class="community-grid">${D.communities.filter(c=>getJoined().has(c.id)).map(communityCard).join("")}</div>`;if(tab==="places")root.innerHTML=`<div class="place-grid">${D.places.filter(p=>getFollowing().has(p.id)).map(placeCard).join("")||'<div class="empty">No seguís lugares todavía.</div>'}</div>`}
document.addEventListener("DOMContentLoaded",()=>{const u=getUser();if(!u){location.href="../auth/register.html";return}document.getElementById("profile-head").innerHTML=`<div class="profile-avatar">${initials(u.username)}</div><div><span class="eyebrow">PERFIL</span><h1>u/${escapeHtml(u.username)}</h1><p>${escapeHtml(u.bio||"Miembro de Managua de Noche.")}</p></div><a class="secondary" href="../settings/index.html">Editar perfil</a>`;showProfileTab("posts",document.querySelector(".profile-tabs button"))})
</script><div id="site-footer"></div><div id="overlay-root"></div><div id="toast-root"></div><script src="../assets/js/data.js"></script><script src="../assets/js/common.js"></script><script>mountChrome('');</script></body></html>
